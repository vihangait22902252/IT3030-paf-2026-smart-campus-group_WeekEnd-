spring.application.name=Backend
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://localhost/smart_campus}
server.port=8085
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=email
app.frontend.url=http://localhost:5173

# Allow bean definition overriding to resolve conflicts
spring.main.allow-bean-definition-overriding=true
# Allow circular references
spring.main.allow-circular-references=true

# Jackson configuration for Date/Time serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Session configuration
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# Logging levels for troubleshooting
logging.level.org.springframework.security=DEBUG
logging.level.Backend=DEBUG